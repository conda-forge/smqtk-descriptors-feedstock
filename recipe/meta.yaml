{% set name = "smqtk-descriptors" %}
{% set version = "0.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/smqtk_descriptors-{{ version }}.tar.gz
  sha256: f6fa6bebb09f8ac50f73f8407e79992ca1b0597a8f79b0a8dea886f922ebb746

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core
  run:
    - python >={{ python_min }},<4.0
    - numpy >=1.23.5
    - smqtk-core >=0.22.0
    - smqtk-dataprovider >=0.20.0
    - smqtk-image-io >=0.19.0

test:
  imports:
    - smqtk_descriptors
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Kitware/SMQTK-Descriptors
  summary: Algorithms, data structures and utilities around computing descriptor vectors from data.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Purg
    - barry-ravichandran
